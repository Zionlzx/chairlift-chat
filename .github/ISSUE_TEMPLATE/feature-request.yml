name: 功能建议
description: 你已经想好一个具体的改法
title: "[建议] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        不用写 PRD。把“想改什么”和“什么时候会用到”说清楚就行。
  - type: textarea
    id: what
    attributes:
      label: 想改什么
      description: 一句话写出你希望眼镜多做或少做什么。
      placeholder: 例：保留按键前 15 秒的视频
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: 什么时候会用到
      description: 你在哪、当时发生了什么、现在怎么凑合？
      placeholder: 例：突然摔倒或做出动作时，往往来不及按开始录制。
    validations:
      required: true
  - type: textarea
    id: tradeoff
    attributes:
      label: 你担心什么（可选）
      description: 续航、误触、隐私、重量，或者任何你觉得需要提前说的代价。
      placeholder: 例：如果一直缓存，会不会让电量掉得太快？
  - type: dropdown
    id: category
    attributes:
      label: 更接近哪一类
      options:
        - 拍摄 / 记录
        - 视频 / 剪辑
        - 连接 / 分享
        - 佩戴 / 交互
        - 续航 / 性能
        - 安全 / 隐私
        - 还说不准
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 发之前确认一下
      options:
        - label: 我搜过相似话题；如果有重复，接受被合并到已有讨论
          required: true
