<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">From slope to shipped</title>
  <desc id="desc">Three notes show a path from a real scene to a discussion and a tested change.</desc>
  <rect width="1100" height="360" rx="24" fill="#f4f0e7"/>
  <path d="M75 278c175-126 267 78 430-61 144-123 210 88 500-87" fill="none" stroke="#17212b" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18"/>
  <g font-family="Arial, sans-serif">
    <g transform="rotate(-5 190 135)">
      <rect x="75" y="70" width="230" height="142" rx="10" fill="#f4c95d"/>
      <text x="99" y="108" fill="#17212b" font-size="15" font-weight="700">01 / NOTICE</text>
      <text x="99" y="143" fill="#17212b" font-size="22" font-weight="700">“I missed</text>
      <text x="99" y="171" fill="#17212b" font-size="22" font-weight="700">the shot.”</text>
    </g>
    <g transform="rotate(4 540 170)">
      <rect x="420" y="96" width="240" height="142" rx="10" fill="#f26b5e"/>
      <text x="446" y="134" fill="#fff8ee" font-size="15" font-weight="700">02 / TALK</text>
      <text x="446" y="169" fill="#fff8ee" font-size="22" font-weight="700">“What breaks</text>
      <text x="446" y="197" fill="#fff8ee" font-size="22" font-weight="700">if we fix it?”</text>
    </g>
    <g transform="rotate(-3 880 160)">
      <rect x="790" y="58" width="235" height="142" rx="10" fill="#8fc6b8"/>
      <text x="816" y="96" fill="#17212b" font-size="15" font-weight="700">03 / TRY</text>
      <text x="816" y="131" fill="#17212b" font-size="22" font-weight="700">“Test it on</text>
      <text x="816" y="159" fill="#17212b" font-size="22" font-weight="700">the next run.”</text>
    </g>
  </g>
</svg>
