<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">From slope to shipped</title>
  <desc id="desc">Three sticky notes follow a path from a real scene to a discussion and a tested change.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#17212b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1100" height="360" rx="26" fill="#f6f1e8"/>

  <text x="38" y="52" fill="#17212b" opacity="0.72" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="4">FROM SLOPE → SHIPPED</text>

  <path d="M330 150 C 420 244, 482 66, 562 150 C 612 206, 700 90, 772 150" fill="none" stroke="#17212b" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 16" opacity="0.5"/>

  <g transform="rotate(-4.5 214 180)" filter="url(#card)">
    <rect x="88" y="98" width="252" height="164" rx="16" fill="#f4c95d"/>
    <rect x="186" y="80" width="86" height="26" rx="5" fill="#f6f1e8" opacity="0.9" transform="rotate(-8 229 93)"/>
    <text x="116" y="142" fill="#17212b" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2">01 · NOTICE</text>
    <text x="116" y="190" fill="#17212b" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic">“I missed</text>
    <text x="116" y="222" fill="#17212b" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic">the shot.”</text>
  </g>

  <g transform="rotate(2.8 550 180)" filter="url(#card)">
    <rect x="424" y="98" width="252" height="164" rx="16" fill="#ef6358"/>
    <rect x="522" y="80" width="86" height="26" rx="5" fill="#f6f1e8" opacity="0.9" transform="rotate(6 565 93)"/>
    <text x="452" y="142" fill="#fff8ee" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2">02 · TALK</text>
    <text x="452" y="190" fill="#fffdf6" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic">“What breaks</text>
    <text x="452" y="222" fill="#fffdf6" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic">if we fix it?”</text>
  </g>

  <g transform="rotate(-3.2 886 180)" filter="url(#card)">
    <rect x="760" y="98" width="252" height="164" rx="16" fill="#7fc4b4"/>
    <rect x="858" y="80" width="86" height="26" rx="5" fill="#f6f1e8" opacity="0.9" transform="rotate(-5 901 93)"/>
    <text x="788" y="142" fill="#17212b" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2">03 · TRY</text>
    <text x="788" y="190" fill="#17212b" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic">“Test it on</text>
    <text x="788" y="222" fill="#17212b" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic">the next run.”</text>
  </g>

  <rect x="0" y="0" width="1100" height="360" filter="url(#grain)" opacity="0.06" pointer-events="none"/>
</svg>