<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Snow day stickers</title>
  <desc id="desc">Three playful stickers for fog, cold battery, and a missed moment.</desc>
  <rect width="1100" height="300" rx="24" fill="#17212b"/>
  <g font-family="Arial, sans-serif" font-weight="700">
    <g transform="rotate(-7 190 150)">
      <rect x="65" y="64" width="245" height="168" rx="22" fill="#e8eef0"/>
      <circle cx="145" cy="135" r="34" fill="#a9c1c9"/>
      <circle cx="235" cy="135" r="34" fill="#a9c1c9"/>
      <path d="M129 187c34 16 86 16 120 0" fill="none" stroke="#17212b" stroke-width="7" stroke-linecap="round"/>
      <text x="92" y="105" fill="#f26b5e" font-size="17">FOG AGAIN?</text>
    </g>
    <g transform="rotate(5 550 150)">
      <rect x="425" y="64" width="245" height="168" rx="22" fill="#f4c95d"/>
      <rect x="507" y="105" width="80" height="90" rx="12" fill="#17212b"/>
      <rect x="524" y="120" width="46" height="45" rx="7" fill="#f26b5e"/>
      <path d="M548 84v-21M516 88l-13-17M580 88l13-17" stroke="#17212b" stroke-width="7" stroke-linecap="round"/>
      <text x="454" y="215" fill="#17212b" font-size="17">COLD BATTERY</text>
    </g>
    <g transform="rotate(-4 910 150)">
      <rect x="785" y="64" width="245" height="168" rx="22" fill="#f26b5e"/>
      <path d="M844 187c34-55 64-83 110-95" fill="none" stroke="#fff8ee" stroke-width="7" stroke-linecap="round"/>
      <path d="M930 84l27 10-20 19" fill="none" stroke="#fff8ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="825" y="215" fill="#fff8ee" font-size="17">MISSED IT</text>
    </g>
  </g>
</svg>
